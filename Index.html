  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-dim-lab:#1e3fa8;--dim-bien:#0f6e56;--dim-fam:#ba7517;\n}\nhtml{scroll-behavior:smooth}\nbody{font-family:var(--f);background:var(--paper);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}\n\n/* PRINT */\n@page{size:A4 portrait;margin:10mm}\n@media print{\n  .no-print{display:none!important}\n  body{background:#fff}\n  .page{display:none!important}\n  #pgFinal.on, #pgMatrix.on{display:block!important}\n  .hero{height:140px!important}\n  .hero-bold{font-size:36px!important}\n  -webkit-print-color-adjust:exact;print-color-adjust:exact\n}\n\n/* HEADER */\n.hdr{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}\n.hdr-in{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;max-width:960px;margin:0 auto;gap:14px}\n.hdr-left{display:flex;align-items:center;gap:11px;min-width:0}\n.hdr-logo{width:44px;height:44px;border-radius:10px;overflow:hidden;flex-shrink:0;box-shadow:0 2px 10px rgba(30,63,168,.22);background:var(--grad);display:block}\n.hdr-logo img{width:100%;height:100%;object-fit:cover;display:block}\n.hdr-brand{font-size:11.5px;font-weight:800;letter-spacing:2.8px;text-transform:uppercase;color:var(--ink);line-height:1.1}\n.hdr-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.2px;margin-top:2px;text-transform:uppercase;font-weight:600}\n.prog-wrap{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-weight:600;flex-shrink:0}\n.prog-bar{width:140px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}\n.prog-fill{height:100%;background:var(--grad);border-radius:2px;transition:width .55s cubic-bezier(.4,.0,.2,1)}\n.hdr-tools{display:flex;gap:6px}\n.icon-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}\n.icon-btn:hover{border-color:var(--p);color:var(--p)}\n\n/* PAGES */\n.page{display:none;min-height:calc(100vh - 70px);flex-direction:column}.page.on{display:flex}\n\n/* HERO */\n.hero{padding:46px 24px 38px;background:var(--grad2);position:relative;overflow:hidden;flex-shrink:0}\n.hero::before{content:\"\";position:absolute;top:-80px;right:-80px;width:380px;height:380px;background:radial-gradient(circle,rgba(255,255,255,.10) 0%,transparent 65%)}\n.hero::after{content:\"\";position:absolute;left:-40px;bottom:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,.06) 0%,transparent 70%)}\n.hero-in{max-width:960px;margin:0 auto;position:relative;z-index:2}\n.hero-eye{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px}\n.hero-thin{display:block;font-size:clamp(18px,2.5vw,24px);font-weight:300;font-style:italic;color:rgba(255,255,255,.78);letter-spacing:.4px;line-height:1.2;margin-bottom:4px}\n.hero-bold{display:block;font-size:clamp(40px,6.5vw,64px);font-weight:900;color:#fff;letter-spacing:-2px;line-height:1}\n.hero-sm{padding:30px 24px 26px}\n.hero-sm .hero-thin{font-size:clamp(14px,2vw,17px)}\n.hero-sm .hero-bold{font-size:clamp(26px,4vw,40px);letter-spacing:-1px}\n\n/* WRAP */\n.wrap{max-width:960px;margin:0 auto;padding:0 24px;width:100%;flex:1;display:flex;flex-direction:column}\n.sec{padding:42px 0 56px;flex:1}\n.sec-sm{padding:26px 0 38px;flex:1}\n\n/* TYPE */\n.lbl{display:block;font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:9px}\n.intro-p{font-size:15.5px;line-height:1.95;color:var(--muted);font-weight:300;max-width:620px;margin-bottom:18px}\n.intro-p strong{color:var(--ink);font-weight:600}\n.step-desc{font-size:15px;line-height:1.85;color:var(--muted);font-weight:300;max-width:660px;margin-bottom:22px}\n.step-desc strong{color:var(--ink);font-weight:600}\n\n/* BUTTONS */\n.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 32px;background:var(--grad);color:#fff;font-family:var(--f);font-size:14px;font-weight:700;border:none;border-radius:9px;cursor:pointer;box-shadow:0 4px 18px rgba(107,63,160,.30);transition:all .2s}\n.btn:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(107,63,160,.42)}\n.btn:active{transform:translateY(0)}\n.btn-ghost{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;background:transparent;color:var(--muted);font-family:var(--f);font-size:13px;font-weight:600;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}\n.btn-ghost:hover{border-color:var(--p);color:var(--p)}\n.btn-big{font-size:16px;padding:18px 44px;border-radius:11px;justify-content:center;max-width:480px;width:100%}\n.btn-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:24px}\n.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}\n.btn[disabled]:hover{transform:none;box-shadow:0 4px 18px rgba(107,63,160,.30)}\n\n/* INPUTS */\n.txt-in{width:100%;max-width:440px;padding:14px 18px;font-family:var(--f);font-size:18px;font-weight:600;color:var(--ink);background:#fff;border:1.5px solid var(--border);border-radius:8px;outline:none;transition:border-color .2s;display:block;margin-bottom:24px}\n.txt-in:focus{border-color:var(--p)}\n.txt-in::placeholder{color:var(--border);font-weight:300}\n\n/* INTRO TIPS */\n.intro-tips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 28px;max-width:680px}\n@media(max-width:620px){.intro-tips{grid-template-columns:1fr}}\n.intro-tip{background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:14px 16px}\n.intro-tip-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;font-size:15px}\n.intro-tip-title{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);margin-bottom:4px}\n.intro-tip-body{font-size:12.5px;color:var(--muted);line-height:1.6}\n\n/* DUMP LIST */\n.dump-counter{display:inline-flex;align-items:center;gap:8px;background:var(--cream);border:1.5px solid var(--border);border-radius:24px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:18px}\n.dump-counter b{color:var(--p);font-size:14px}\n.dump-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;max-width:640px}\n.dump-row{position:relative;background:#fff;border:1.5px solid var(--border);border-radius:10px;display:flex;align-items:center;transition:border-color .2s,background .2s}\n.dump-row.filled{border-color:rgba(107,63,160,.28);background:#fafaf8}\n.dump-row.focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(107,63,160,.08)}\n.dump-num{width:38px;text-align:center;font-size:12px;font-weight:800;color:var(--border);user-select:none;flex-shrink:0;transition:color .2s}\n.dump-row.filled .dump-num,.dump-row.focus .dump-num{color:var(--p)}\n.dump-in{flex:1;padding:12px 8px;font-family:var(--f);font-size:14.5px;font-weight:500;color:var(--ink);background:transparent;border:none;outline:none;min-width:0}\n.dump-in::placeholder{color:#c8c4bf;font-weight:400}\n.dump-rm{width:36px;height:36px;border:none;background:none;color:var(--border);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .2s;font-family:sans-serif}\n.dump-rm:hover{color:var(--rose)}\n.add-row-btn{display:inline-flex;align-items:center;gap:7px;background:none;border:1.5px dashed var(--border);border-radius:9px;padding:10px 18px;font-family:var(--f);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}\n.add-row-btn:hover{border-color:var(--p);color:var(--p);background:rgba(107,63,160,.03)}\n.dump-hint{display:flex;align-items:flex-start;gap:9px;background:#fff;border:1px solid var(--border);border-left:3px solid var(--p);border-radius:8px;padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.7;margin:18px 0;max-width:640px}\n.dump-hint strong{color:var(--in ration:none;padding:5px 11px;border:1px solid rgba(255,255,255,.18);border-radius:20px;transition:all .2s}\n.soc-a:hover{border-color:var(--p);color:var(--p)}\n.soc-a svg{width:12px;height:12px;flex-shrink:0}\n\n/* TOAST */\n.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;max-width:90vw}\n.toast.show{transform:translateX(-50%) translateY(0)}\n\n/* TWEAKS */\n.tweaks-fab{position:fixed;bottom:18px;right:18px;width:44px;height:44px;border-radius:50%;background:#fff;border:1.5px solid var(--border);box-shadow:0 4px 14px rgba(0,0,0,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:400;transition:all .2s}\n.tweaks-fab:hover{border-color:var(--p);color:var(--p);transform:rotate(30deg)}\n.tweaks-panel{position:fixed;bottom:74px;right:18px;width:260px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.16);z-index:401;display:none}\n.tweaks-panel.on{display:block}\n.tweaks-title{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--ink);margin-bottom:12px}\n.tweak-row{margin-bottom:14px}\n.tweak-row:last-child{margin-bottom:0}\n.tweak-lbl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;display:block}\n.tweak-segs{display:flex;gap:4px;background:var(--cream);border-radius:8px;padding:3px}\n.tweak-seg{flex:1;padding:6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);border-radius:6px;cursor:pointer;border:none;background:none;font-family:var(--f)}\n.tweak-seg.on{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.1)}\n\n@media(max-width:560px){\n  .matrix-grid{grid-template-columns:1fr}\n  .matrix-y{display:none}\n  .matrix-layout{grid-template-columns:1fr}\n  .matrix-axes-top{grid-template-columns:1fr 1fr}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- HEADER -->\n<header class=\"hdr no-print\">\n  <div class=\"hdr-in\">\n    <div class=\"hdr-left\">\n      <div class=\"hdr-logo\"><img src=\"5ee3ff48-6ce2-4e83-98e4-8a0b025e0689\" alt=\"Tenkai Consulting\"><\u002Fdiv>\n      <div>\n        <div class=\"hdr-brand\">Tenkai<\u002Fdiv>\n        <div class=\"hdr-sub\">Arquitectura de Prioridades<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"prog-wrap\">\n      <span id=\"progTxt\">Gestión del Tiempo<\u002Fspan>\n      <div class=\"prog-bar\" id=\"progBarWrap\" style=\"display:none\">\n        <div class=\"prog-fill\" id=\"progFill\" style=\"width:0%\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hdr-tools\">\n      <button class=\"icon-btn\" id=\"restartBtn\" title=\"Reiniciar\" onclick=\"restartFlow()\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══════════════ INTRO ════════════════════════════════ -->\n<div id=\"pgIntro\" class=\"page on\">\n  <div class=\"hero\">\n    <div class=\"hero-in\">\n      <p class=\"hero-eye\">Tenkai Consulting<\u002Fp>\n      <span class=\"hero-thin\">Arquitectura de<\u002Fspan>\n      <span class=\"hero-bold\">Prioridades.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wrap\"><div class=\"sec\">\n    <p class=\"intro-p\">Un protocolo de cuatro pasos para <strong>ordenar tu carga cognitiva<\u002Fstrong>, jerarquizar lo que realmente impulsa tu agenda y traducirlo en un plan ejecutable.<\u002Fp>\n    <p class=\"intro-p\">No vas a clasificar nada manualmente. Vas a <strong>volcar lo que ocupa tu atención<\u002Fstrong>, responder dos preguntas por ítem, y el sistema construye tu matriz estratégica en tiempo real.<\u002Fp>\n\n    <div class=\"intro-tips\">\n      <div class=\"intro-tip\">\n        <div class=\"intro-tip-icon\" style=\"background:rgba(194,65,90,.10);color:var(--rose);font-weight:900\">01<\u002Fdiv>\n        <div class=\"intro-tip-title\">Descarga mental<\u002Fdiv>\n        <div class=\"intro-tip-body\">Volcado total de pendientes y cuestiones en curso.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"intro-tip\">\n        <div class=\"intro-tip-icon\" style=\"background:rgba(107,63,160,.10);color:var(--p);font-weight:900\">02<\u002Fdiv>\n        <div class=\"intro-tip-title\">Clasificación<\u002Fdiv>\n        <div class=\"intro-tip-body\">Dos pasadas: urgencia e importancia. Decisión rápida.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"intro-tip\">\n        <div class=\"intro-tip-icon\" style=\"background:rgba(26,159,168,.10);color:var(--teal);font-weight:900\">03<\u002Fdiv>\n        <div class=\"intro-tip-title\">Mapa estratégico<\u002Fdiv>\n        <div class=\"intro-tip-body\">Tu matriz armada con un insight de coaching.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <span class=\"lbl\">Tu nombre<\u002Fspan>\n    <input class=\"txt-in\" id=\"nameInput\" placeholder=\"¿Cómo te llamás?\" autocomplete=\"off\">\n    <div class=\"btn-row\">\n      <button class=\"btn\" onclick=\"startFlow()\">\n        Iniciar protocolo\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n  <footer class=\"tk-footer no-print\">\n    <div class=\"tk-footer-in\">\n      <div class=\"footer-brand\">TENKAI CONSULTING<\u002Fdiv>\n      <div class=\"soc-row\" id=\"soc0\"><\u002Fdiv>\n      <div class=\"footer-copy\">ARQUITECTURA DE PRIORIDADES · © 2026 TENKAI CONSULTING<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<!-- ═══════════════ BRAIN DUMP ════════════════════════════════ -->\n<div id=\"pgDump\" class=\"page\">\n  <div class=\"hero hero-sm\" style=\"background:linear-gradient(135deg,#c2415a 0%,#6b3fa0 100%)\">\n    <div class=\"hero-in\">\n      <p class=\"hero-eye\" id=\"dumpEye\">Paso 1 de 4 · Descarga mental<\u002Fp>\n      <span class=\"hero-thin\">Inventario de<\u002Fspan>\n      <span class=\"hero-bold\">pendientes.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wrap\"><div class=\"sec-sm\">\n    <p class=\"step-desc\">Trae al frente <strong>todos tus pendientes y cuestiones en curso<\u002Fstrong>. Es momento de ordenar el caos y dar estructura a lo que ocupa tu atención. No filtres ni jerarquices — eso lo hacemos después. Cada Enter agrega una línea nueva.<\u002Fp>\n\n    <span class=\"dump-counter\"><b id=\"dumpCount\">0<\u002Fb> ítems en la lista<\u002Fspan>\n\n    <div class=\"dump-list\" id=\"dumpList\"><\u002Fdiv>\n\n    <button class=\"add-row-btn\" onclick=\"addDumpRow(true)\">\n      <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n      Agregar otro ítem\n    <\u002Fbutton>\n\n    <div class=\"dump-hint\">\n      <strong>↳<\u002Fstrong> <span><strong>Sugerencia:<\u002Fstrong> incluí también dimensiones personales (salud, vínculos, descanso). Suelen ser las que más impactan en la productividad sostenible.<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"btn-row\">\n      <button class=\"btn-ghost\" onclick=\"goPage('pgIntro')\">\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M19 12H5M12 19l-7-7 7-7\"><\u002Fpath><\u002Fsvg>\n        Atrás\n      <\u002Fbutton>\n      <button class=\"btn\" id=\"dumpNextBtn\" onclick=\"startTinder()\" disabled=\"\">\n        Empezar a clasificar\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M5 12h14M12 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════ TINDER ════════════════════════════════ -->\n<div id=\"pgTinder\" class=\"page\">\n  <div class=\"hero hero-sm\" id=\"tinderHero\" style=\"background:linear-gradient(135deg,#c2415a 0%,#6b3fa0 100%)\">\n    <div class=\"hero-in\">\n      <p class=\"hero-eye\" id=\"tinderEye\">Paso 2 de 4 · Filtro rápido<\u002Fp>\n      <span class=\"hero-thin\" id=\"tinderThin\">Una pregunta por vez.<\u002Fspan>\n      <span class=\"hero-bold\" id=\"tinderBold\">¿Urgente?<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"wrap\"><div class=\"sec-sm\">\n    <div class=\"tinder-stage\">\n      <div class=\"tinder-meta\">\n        <span class=\"tinder-pill urg\" id=\"pillUrg\">⚡ Pasada 1 · Urgencia<\u002Fspan>\n        <span class=\"tinder-pill imp\" id=\"pillImp\" style=\"display:none\">🌱 Pasada 2 · Importancia<\u002Fspan>\n        <span class=\"tinder-counter\" id=\"tinderCounter\">1 / 5<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"tinder-progress\"><div class=\"tinder-progress-fill\" id=\"tinderProgress\" style=\"width:0%\"><\u002Fdiv><\u002Fdiv>\n\n      <p class=\"tinder-q\" id=\"tinderQ\">¿Tiene una fecha límite inminente?<\u002Fp>\n      <p class=\"tinder-q-sub\" id=\"tinderQSub\">¿Pasa algo grave si no lo hacés en las próximas 48 hs?<\u002Fp>\n\n      <div class=\"tinder-deck\" id=\"tinderDeck\"><\u002Fdiv>\n\n      <div class=\"tinder-buttons\">\n        <button class=\"tinder-btn tinder-btn-no\" onclick=\"answerTinder(false)\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n          <span id=\"btnNoLabel\">NO, puede esperar<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"tinder-btn tinder-btn-yes\" onclick=\"answerTinder(true)\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n          <span id=\"btnYesLabel\">SÍ, es urgente<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <button class=\"tinder-undo\" id=\"tinderUndo\" onclick=\"undoTinder()\">↶ Deshacer última<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════ LOADING ════════════════════════════════ -->\n<div id=\"pgLoading\" class=\"page\">\n  <div class=\"loading-stage\">\n    <div class=\"loading-circle\">\n      <svg viewBox=\"0 0 100 100\" fill=\"none\">\n        <circle cx=\"50\" cy=\"50\" r=\"42\" stroke=\"rgba(107,63,160,.12)\" stroke-width=\"6\"><\u002Fcircle>\n        <circle cx=\"50\" cy=\"50\" r=\"42\" stroke=\"url(#lg)\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-dasharray=\"80 200\"><\u002Fcircle>\n        <defs>\n          <linearGradient id=\"lg\" x1=\"0\" y1=\"0\" x2=\"100\" y2=\"100\">\n            <stop offset=\"0%\" stop-color=\"#6b3fa0\"><\u002Fstop>\n            <stop offset=\"50%\" stop-color=\"#1e3fa8\"><\u002Fstop>\n            <stop offset=\"100%\" stop-color=\"#1a9fa8\"><\u002Fstop>\n          <\u002FlinearGradient>\n        <\u002Fdefs>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div>\n      <div class=\"loading-title\">Armando tu matriz…<\u002Fdiv>\n      <div class=\"loading-step\" id=\"loadingStep\">Procesando respuestas<\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"loading-sub\">Estamos cruzando lo que respondiste para acomodar cada cosa donde corresponde. Sin que tengas que pensarlo.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════════ MATRIX ════════════════════════════════ -->\n<div id=\"pgMatrix\" class=\"page\">\n  <div class=\"hero hero-sm\" style=\"background:linear-gradient(135deg,#6b3fa0 0%,#1e3fa8 100%)\">\n    <div class=\"hero-in\">\n      <p class=\"hero-eye\" id=\"matrixEye\">Paso 3 unidad de delegar'},\n  descartar:{name:'DESCARTAR SIN CULPA',color:'#6b6560',desc:'Ruido que no aporta',insight:'ruido a soltar'}\n};\nlet state={\n  name:'',\n  items:[],          // {id, text, urgente?:bool, importante?:bool, q?:string, day?:0-6, dim?:'lab'|'bien'|'fam', done?:bool}\n  filterMode:'separate',\n  density:'cozy',\n  palette:'rosa',\n  showDims:false\n};\nlet tinder={pass:1,idx:0,history:[]};\n\nfunction save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}\nfunction load(){try{const d=localStorage.getItem(LS);if(d){const p=JSON.parse(d);state={...state,...p};applyTweaks();}}catch(e){}}\nconst uid=()=>'i'+Math.random().toString(36).slice(2,9);\n\n// ═══════════════ UTILS ════════════════════════════════\nfunction toast(msg,dur=2400){\n  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');\n  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),dur);\n}\nfunction goPage(id){\n  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));\n  document.getElementById(id).classList.add('on');\n  window.scrollTo({top:0,behavior:'smooth'});\n  updateProg(id);\n}\nconst PG_PROG={pgIntro:[0,4],pgDump:[1,4],pgTinder:[2,4],pgLoading:[2,4],pgMatrix:[3,4],pgFoco:[4,4],pgFinal:[4,4]};\nfunction updateProg(id){\n  const [s,t]=PG_PROG[id]||[0,0];\n  const txt=document.getElementById('progTxt');\n  const wrap=document.getElementById('progBarWrap');\n  const fill=document.getElementById('progFill');\n  if(s>0){txt.textContent=`Paso ${s} de ${t}`;wrap.style.display='';fill.style.width=Math.round(s/t*100)+'%';}\n  else{txt.textContent='Gestión del Tiempo';wrap.style.display='none';}\n}\n\n// ═══════════════ INTRO ════════════════════════════════\nfunction startFlow(){\n  const n=document.getElementById('nameInput').value.trim();\n  if(!n){toast('Escribí tu nombre para empezar');return;}\n  state.name=n;save();\n  goPage('pgDump');\n  buildDumpList();\n}\n\n// ═══════════════ BRAIN DUMP ════════════════════════════════\nfunction buildDumpList(){\n  const list=document.getElementById('dumpList');list.innerHTML='';\n  const existing=state.items.filter(i=>i.text);\n  const min=Math.max(5,existing.length+1);\n  // Make sure we have items objects to back rows\n  const rows=[];\n  for(let i=0;i<min;i++){\n    if(existing[i])rows.push(existing[i]);\n    else rows.push({id:uid(),text:''});\n  }\n  state.items=rows;\n  rows.forEach((it,idx)=>list.appendChild(buildDumpRow(it,idx)));\n  refreshDumpCount();\n  setTimeout(()=>{const f=list.querySelector('.dump-in');if(f)f.focus();},120);\n}\nfunction buildDumpRow(it,idx){\n  const r=document.createElement('div');r.className='dump-row'+(it.text?' filled':'');r.dataset.id=it.id;\n  r.innerHTML=`\n    <span class=\"dump-num\">${String(idx+1).padStart(2,'0')}<\u002Fspan>\n    <input class=\"dump-in\" type=\"text\" placeholder=\"Ej: Armar el reporte mensual\" autocomplete=\"off\" value=\"${escapeHtml(it.text||'')}\">\n    <button class=\"dump-rm\" title=\"Eliminar\" tabindex=\"-1\">×<\u002Fbutton>`;\n  const inp=r.querySelector('.dump-in');\n  inp.addEventListener('input',()=>{\n    const tgt=state.items.find(x=>x.id===it.id);if(tgt)tgt.text=inp.value;\n    r.classList.toggle('filled',!!inp.value.trim());\n    refreshDumpCount();save();\n  });\n  inp.addEventListener('focus',()=>r.classList.add('focus'));\n  inp.addEventListener('blur',()=>r.classList.remove('focus'));\n  inp.addEventListener('keydown',e=>{\n    if(e.key==='Enter'){e.preventDefault();\n      // jump to next or add new\n      const all=document.querySelectorAll('#dumpList .dump-in');\n      const i=Array.from(all).indexOf(inp);\n      if(i<all.length-1)all[i+1].focus();\n      else addDumpRow(true);\n    } else if(e.key==='Backspace' && !inp.value){\n      const all=document.querySelectorAll('#dumpList .dump-in');\n      if(all.length>1){e.preventDefault();removeDumpRow(it.id);\n        // focus prev\n        const i=Array.from(all).indexOf(inp);\n        setTimeout(()=>{const newAll=document.querySelectorAll('#dumpList .dump-in');(newAll[Math.max(0,i-1)]||newAll[0]).focus();},10);\n      }\n    }\n  });\n  r.querySelector('.dump-rm').addEventListener('click',()=>removeDumpRow(it.id));\n  return r;\n}\nfunction addDumpRow(focus){\n  const it={id:uid(),text:''};\n  state.items.push(it);\n  const list=document.getElementById('dumpList');\n  list.appendChild(buildDumpRow(it,state.items.length-1));\n  refreshDumpCount();\n  if(focus)setTimeout(()=>list.lastElementChild.querySelector('.dump-in').focus(),20);\n}\nfunction removeDumpRow(id){\n  state.items=state.items.filter(x=>x.id!==id);\n  if(state.items.length<5){\n    while(state.items.length<5)state.items.push({id:uid(),text:''});\n  }\n  // re-render to fix numbering\n  const list=document.getElementById('dumpList');list.innerHTML='';\n  state.items.forEach((it,idx)=>list.appendChild(buildDumpRow(it,idx)));\n  refreshDumpCount();save();\n}\nfunction refreshDumpCount(){\n  const filled=state.items.filter(i=>i.text&&i.text.trim()).length;\n  document.getElementById('dumpCount').textContent=filled;\n  const btn=document.getElementById('dumpNextBtn');\n  btn.disabled=filled<3;\n}\nfunction escapeHtml(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'})[c]);}\n\n// ═══════════════ TINDER ════════════════════════════════\nfunction startTinder(){\n  // Filter only items with text, reset answers\n  const valid=state.items.filter(i=>i.text&&i.text.trim()).map(i=>({...i,urgente:undefined,importante:undefined,q:undefined}));\n  if(valid.length<3){toast('Necesitás al menos 3 ítems');return;}\n  state.items=valid;\n  tinder={pass:1,idx:0,history:[]};\n  save();\n  goPage('pgTinder');\n  renderTinder();\n}\nfunction renderTinder(){\n  const total=state.items.length;\n  const idx=tinder.idx;\n  // Headers\n  const eye=document.getElementById('tinderEye');\n  const thin=document.getElementById('tinderThin');\n  const bold=document.getElementById('tinderBold');\n  const hero=document.getElementById('tinderHero');\n  const q=document.getElementById('tinderQ');\n  const qsub=document.getElementById('tinderQSub');\n  const pillU=document.getElementById('pillUrg');\n  const pillI=document.getElementById('pillImp');\n  const yesBtn=document.getElementById('btnYesLabel');\n  const noBtn=document.getElementById('btnNoLabel');\n\n  if(tinder.pass===1){\n    eye.textContent=`Paso 2 de 4 · Eje de Urgencia`;\n    thin.textContent='Primer eje de la matriz.';\n    bold.textContent='Urgencia.';\n    hero.style.background='linear-gradient(135deg,#c2415a 0%,#6b3fa0 100%)';\n    q.textContent='¿Tiene una fecha límite inminente?';\n    qsub.textContent='Urgente = requiere acción inmediata. Si no se resuelve en las próximas 48 horas hay un impacto significativo (entrega, reunión, deadline, etc.).';\n    pillU.style.display='';pillI.style.display='none';\n    yesBtn.textContent='SÍ, es urgente';noBtn.textContent='NO, puede esperar';\n  } else {\n    eye.textContent=`Paso 2 de 4 · Eje de Importancia`;\n    thin.textContent='Segundo eje. Mismo ítem, otra mirada.';\n    bold.textContent='Importancia.';\n    hero.style.background='linear-gradient(135deg,#1e3fa8 0%,#1a9fa8 100%)';\n    q.textContent='¿Aporta a tus objetivos estratégicos o bienestar de mediano plazo?';\n    qsub.textContent='Importante = tiene impacto real en tu carrera, salud, vínculos o crecimiento más allá de la semana. No es ruido operativo del momento.';\n    pillU.style.display='none';pillI.style.display='';\n    yesBtn.textContent='SÍ, es importante';noBtn.textContent='NO, es ruido';\n  }\n\n  document.getElementById('tinderCounter').textContent=`${idx+1} / ${total}`;\n  const totalSteps=total*2;\n  const done=(tinder.pass===1?idx:total+idx);\n  document.getElementById('tinderProgress').style.width=Math.round(done/totalSteps*100)+'%';\n  document.getElementById('tinderUndo').style.display=tinder.history.length?'':'none';\n\n  // Build deck (current + next 2)\n  const deck=document.getElementById('tinderDeck');deck.innerHTML='';\n  for(let k=0;k<3;k++){\n    const itIdx=idx+k;\n    if(itIdx>=total)break;\n    const it=state.items[itIdx];\n    const card=document.createElement('div');\n    card.className='tinder-card '+(k===1?'bg1':k===2?'bg2':'');\n    card.dataset.itemId=it.id;\n    card.innerHTML=`\n      <div class=\"tinder-card-num\">Tarea ${itIdx+1} de ${total}<\u002Fdiv>\n      <div class=\"tinder-card-txt\">${escapeHtml(it.text)}<\u002Fdiv>\n      <div class=\"tinder-card-stamp yes\">SÍ<\u002Fdiv>\n      <div class=\"tinder-card-stamp no\">NO<\u002Fdiv>`;\n    if(k===0)attachSwipe(card);\n    deck.appendChild(card);\n  }\n}\nfunction attachSwipe(card){\n  let startX=0,startY=0,curX=0,curY=0,dragging=false,pid=null;\n  const onDown=e=>{\n    if(e.button!==undefined&&e.button!==0)return;\n    dragging=true;pid=e.pointerId;\n    startX=e.clientX;startY=e.clientY;curX=0;curY=0;\n    card.classList.add('dragging');\n    try{card.setPointerCapture(pid);}catch(_){}\n  };\n  const onMove=e=>{\n    if(!dragging)return;\n    curX=e.clientX-startX;curY=e.clientY-startY;\n    const rot=curX/14;\n    card.style.transform=`translate(${curX}px,${curY*.4}px) rotate(${rot}deg)`;\n    const yes=card.querySelector('.tinder-card-stamp.yes');\n    const no=card.querySelector('.tinder-card-stamp.no');\n    if(yes)yes.style.opacity=Math.max(0,Math.min(1,curX/100));\n    if(no)no.style.opacity=Math.max(0,Math.min(1,-curX/100));\n  };\n  const onUp=()=>{\n    if(!dragging)return;\n    dragging=false;\n    card.classList.remove('dragging');\n    try{card.releasePointerCapture(pid);}catch(_){}\n    if(curX>110){answerTinder(true);}\n    else if(curX<-110){answerTinder(false);}\n    else{card.style.transform='';\n      card.querySelectorAll('.tinder-card-stamp').forEach(s=>s.style.opacity=0);\n    }\n  };\n  card.addEventListener('pointerdown',onDown);\n  card.addEventListener('pointermove',onMove);\n  card.addEventListener('pointerup',onUp);\n  card.addEventListener('pointercancel',onUp);\n}\nfunction answerTinder(yes){\n  const it=state.items[tinder.idx];if(!it)return;\n  const card=document.querySelector('.tinder-deck .tinder-card:not(.bg1):not(.bg2)');\n  if(card){card.classList.add(yes?'fly-yes':'fly-no');}\n  if(tinder.pass===1)it.urgente=yes;\n  else it.importante=yes;\n  tinder.history.push({pass:tinder.pass,idx:tinder.idx,yes});\n  setTimeout(()=>{\n    tinder.idx++;\n    if(tinder.idx>=state.items.length){\n      if(tinder.pass===1){\n        tinder.pass=2;tinder.idx=0;tinder.history=[];\n        window.scrollTo({top:0,behavior:'smooth'});\n        renderTinder();\n        const heroEl=document.getElementById('tinderHero');\n        heroEl.style.transition='filter .5s';\n        heroEl.style.filter='brightness(1.15) saturate(1.3)';\n        setTimeout(()=>{heroEl.style.filter='';},520);\n        toast('Eje 2: ahora la lente cambia a importancia',2800);\n        save();\n      } else {\n        // Done — assign quadrants\n        state.items.forEach(i=>{i.q=quadrantFor(i.urgente,i.importante);});\n        save();\n        runReveal();\n      }\n    } else {\n      renderTinder();save();\n    }\n  },yes||!yes ? 280 : 0);\n}\nfunction undoTinder(){\n  const last=tinder.history.pop();if(!last)return;\n  if(last.pass!==tinder.pass){tinder.pass=last.pass;}\n  tinder.idx=last.idx;\n  const it=state.items[last.idx];\n  if(last.pass===1)it.urgente=undefined;\n  else it.importante=undefined;\n  save();renderTinder();\n}\nfunction quadrantFor(u,i){\n  if(u&&i)return'hacer';\n  if(!u&&i)return'planif';\n  if(u&&!i)return'liberar';\n  return'descartar';\n}\n\n// ═══════════════ LOADING + REVEAL ════════════════════════════════\nfunction runReveal(){\n  goPage('pgLoading');\n  const steps=['Procesando respuestas','Cruzando urgencia × importancia','Acomodando cuadrantes','Generando insight'];\n  let s=0;\n  const stepEl=document.getElementById('loadingStep');\n  stepEl.textContent=steps[0];\n  const iv=setInterval(()=>{s++;if(s>=steps.length){clearInterval(iv);return;}stepEl.style.opacity=0;setTimeout(()=>{stepEl.textContent=steps[s];stepEl.style.opacity=1;},200);},460);\n  setTimeout(()=>{clearInterval(iv);renderMatrix(true);goPage('pgMatrix');},2100);\n}\n\n// ═══════════════ MATRIX ════════════════════════════════\nfunction renderMatrix(animate){\n  ['hacer','planif','liberar','descartar'].forEach(q=>{\n    const list=document.getElementById('tasks-'+q);list.innerHTML='';\n    const items=state.items.filter(i=>i.q===q);\n    document.getElementById('cnt-'+q).textContent=items.length;\n    if(!items.length){\n      const e=document.createElement('div');e.className='matrix-empty';e.textContent='Vacío — bien por vos';list.appendChild(e);\n    } else {\n      items.forEach(it=>list.appendChild(buildTaskCard(it)));\n    }\n  });\n  if(animate)flyAnimation();\n  showInsight();\n  if(state.showDims)refreshDimsUI();\n}\nfunction buildTaskCard(it){\n  const c=document.createElement('div');c.className='task-card';c.draggable=true;c.dataset.id=it.id;\n  c.style.borderLeftColor=Q_META[it.q].color;\n  const dimColor=it.dim?({lab:'var(--dim-lab)',bien:'var(--dim-bien)',fam:'var(--dim-fam)'})[it.dim]:'var(--border)';\n  c.innerHTML=`\n    <div class=\"task-cb${it.done?' done':''}\" title=\"Marcar completada\"><\u002Fdiv>\n    <div class=\"task-title${it.done?' done-txt':''}\">${escapeHtml(it.text)}<\u002Fdiv>\n    <div class=\"task-dim\" style=\"background:${dimColor};${state.showDims?'cursor:pointer':''}\" title=\"${it.dim||'Sin dimensión'}\"><\u002Fdiv>\n    <button class=\"task-rm\" title=\"Eliminar\">×<\u002Fbutton>`;\n  c.querySelector('.task-cb').addEventListener('click',e=>{e.stopPropagation();it.done=!it.done;save();renderMatrix(false);});\n  c.querySelector('.task-rm').addEventListener('click',e=>{e.stopPropagation();state.items=state.items.filter(x=>x.id!==it.id);save();renderMatrix(false);});\n  if(state.showDims)c.querySelector('.task-dim').addEventListener('click',e=>{e.stopPropagation();cycleDim(it.id);});\n  c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/id',it.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});\n  c.addEventListener('dragend',()=>c.classList.remove('dragging'));\n  return c;\n}\nfunction cycleDim(id){\n  const it=state.items.find(x=>x.id===id);if(!it)return;\n  const order=[undefined,'lab','bien','fam'];\n  const i=order.indexOf(it.dim);it.dim=order[(i+1)%order.length];save();renderMatrix(false);\n}\nfunction qDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}\nfunction qDragLeave(e){e.currentTarget.classList.remove('drag-over');}\nfunction qDrop(e,q){\n  e.preventDefault();e.currentTarget.classList.remove('drag-over');\n  const id=e.dataTransfer.getData('text/id');\n  const it=state.items.find(x=>x.id===id);if(!it)return;\n  it.q=q;\n  // re-derive urg/imp flags (not strict — q is source of truth)\n  if(q==='hacer'){it.urgente=true;it.importante=true;}\n  if(q==='planif'){it.urgente=false;it.importante=true;}\n  if(q==='liberar'){it.urgente=true;it.importante=false;}\n  if(q==='descartar'){it.urgente=false;it.importante=false;}\n  save();renderMatrix(false);\n}\n\n// FLY ANIMATION — cards start stacked at center, fly to position\nfunction flyAnimation(){\n  const grid=document.getElementById('matrixGrid');\n  if(!grid)return;\n  const gridRect=grid.getBoundingClientRect();\n  const centerX=gridRect.left+gridRect.width/2;\n  const centerY=gridRect.top+gridRect.height/2;\n  const cards=grid.querySelectorAll('.task-card');\n  cards.forEach((card,i)=>{\n    const r=card.getBoundingClientRect();\n    const cardCx=r.left+r.width/2;\n    const cardCy=r.top+r.height/2;\n    const dx=centerX-cardCx;\n    const dy=centerY-cardCy;\n    card.classList.add('flying');\n    card.style.transform=`translate(${dx}px,${dy}px) scale(.4)`;\n    card.style.opacity='0';\n    setTimeout(()=>{\n      card.style.transform='';card.style.opacity='1';\n      setTimeout(()=>card.classList.remove('flying'),650);\n    },120+i*90);\n  });\n}\n\n// INSIGHT\nfunction showInsight(){\n  const total=state.items.length||1;\n  const counts={hacer:0,planif:0,liberar:0,descartar:0};\n  state.items.forEach(i=>{if(counts[i.q]!==undefined)counts[i.q]++;});\n  const pct={};Object.keys(counts).forEach(k=>pct[k]=counts[k]/total);\n  let title='Lectura de coaching',text='';\n  const max=Object.keys(counts).reduce((a,b)=>counts[a]>counts[b]?a:b);\n\n  if(pct.hacer>=.5){\n    title='Atención · modo bombero';\n    text=`<strong>${counts.hacer} de ${total}<\u002Fstrong> tareas están en HACER. Estás apagando incendios. <strong>Tu objetivo esta semana<\u002Fstrong>: mover al menos 2 cosas a PLANIFICAR para que dejen de volverse urgentes.`;\n  } else if(pct.planif>=.5){\n    title='Vas bien · zona de crecimiento';\n    text=`Más de la mitad está en PLANIFICAR. Estás invirtiendo en lo importante antes de que apure. <strong>Mantené esa disciplina<\u002Fstrong> y protegé estos bloques en tu agenda.`;\n  } else if(pct.descartar>=.4){\n    title='Buena noticia · mucho ruido';\n    text=`Casi la mitad de lo que tenías en la cabeza es ruido que no aporta. <strong>Soltarlo es trabajo terminado<\u002Fstrong>. Mirá lo que queda en HACER y PLANIFICAR — ahí está tu semana real.`;\n  } else if(pct.liberar>=.3){\n    title='Oportunidad de delegar';\n    text=`Hay <strong>${counts.liberar} cosas urgentes que no son importantes para vos<\u002Fstrong>. Pensá a quién podés liberarles esa carga. Cada delegación bien hecha te devuelve tiempo estratégico.`;\n  } else {\n    const m=Q_META[max];\n    title=`Tu zona dominante: ${m.name}`;\n    text=`La mayoría de tus tareas (${counts[max]} de ${total}) están en ${m.name} — ${m.insight}. Mirá qué te dice eso de tu semana.`;\n  }\n  const card=document.getElementById('insightCard');\n  document.getElementById('insightTitle').textContent=title;\n  document.getElementById('insightText').innerHTML=text;\n  card.classList.remove('show');\n  setTimeout(()=>card.classList.add('show'),700);\n}\n\n// DIMENSIONS\nfunction toggleDims(){\n  state.showDims=!state.showDims;save();\n  document.getElementById('dimPanel').style.display=state.showDims?'':'none';\n  document.getElementById('dimToggleBtn').textContent=state.showDims?'– Ocultar etiquetas':'+ Activar etiquetas por dimensión';\n  document.getElementById('dimToggleBtn').classList.toggle('on',state.showDims);\n  renderMatrix(false);\n}\nfunction refreshDimsUI(){\n  document.getElementById('dimPanel').style.display=state.showDims?'':'none';\n  document.getElementById('dimToggleBtn').textContent=state.showDims?'– Ocultar etiquetas':'+ Activar etiquetas por dimensión';\n  document.getElementById('dimToggleBtn').classList.toggle('on',state.showDims);\n}\n\n// ═══════════════ FOCO ════════════════════════════════\nfunction goFoco(){\n  goPage('pgFoco');\n  renderFoco();\n}\nfunction renderFoco(){\n  // Pool: hacer + planif unassigned\n  const pool=state.items.filter(i=>(i.q==='hacer'||i.q==='planif')&&i.day===undefined&&!i.done);\n  const poolList=document.getElementById('focoPoolList');\n  poolList.innerHTML='';\n  if(!pool.length){\n    poolList.innerHTML='<div class=\"foco-pool-empty\">Todo asignado. Buen trabajo.<\u002Fdiv>';\n  } else {\n    pool.forEach(it=>poolList.appendChild(buildFocoChip(it)));\n  }\n  document.getElementById('focoPoolCount').textContent=pool.length+' sin asignar';\n\n  // Week grid\n  const wg=document.getElementById('weekGrid');wg.innerHTML='';\n  for(let d=0;d<7;d++){\n    const day=document.createElement('div');day.className='week-day';day.dataset.day=d;\n    const items=state.items.filter(i=>i.day===d);\n    const overflow=items.length>3;\n    if(overflow)day.classList.add('warning');\n    day.innerHTML=`\n      <div class=\"week-day-hd\">\n        <span class=\"week-day-name\">${DAYS[d]}<\u002Fspan>\n        <span class=\"week-day-cnt${overflow?' warn':''}\">${items.length}/3<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"week-day-tasks\"><\u002Fdiv>`;\n    const t=day.querySelector('.week-day-tasks');\n    if(!items.length){\n      const e=document.createElement('div');e.className='week-day-empty';e.textContent='Soltá tareas acá';t.appendChild(e);\n    } else {\n      items.forEach(it=>t.appendChild(buildWeekTask(it)));\n    }\n    day.addEventListener('dragover',e=>{e.preventDefault();day.classList.add('drag-over');});\n    day.addEventListener('dragleave',()=>day.classList.remove('drag-over'));\n    day.addEventListener('drop',e=>{\n      e.preventDefault();day.classList.remove('drag-over');\n      const id=e.dataTransfer.getData('text/id');\n      const it=state.items.find(x=>x.id===id);if(!it)return;\n      const cur=state.items.filter(i=>i.day===d).length;\n      // Allow moving within day; but block if adding 4th from outside\n      if(it.day!==d && cur>=3){\n        showWarn(d);\n        // still allow but flag warning\n      }\n      it.day=d;save();renderFoco();\n    });\n    wg.appendChild(day);\n  }\n  // Pool drop (back to pool)\n  const pl=document.getElementById('focoPoolList');\n  pl.addEventListener('dragover',e=>{e.preventDefault();});\n  pl.addEventListener('drop',e=>{\n    e.preventDefault();\n    const id=e.dataTransfer.getData('text/id');\n    const it=state.items.find(x=>x.id===id);if(!it)return;\n    it.day=undefined;save();renderFoco();\n  });\n}\nfunction buildFocoChip(it){\n  const c=document.createElement('div');c.className='foco-chip';c.draggable=true;c.dataset.id=it.id;\n  c.style.borderLeftColor=Q_META[it.q].color;\n  c.innerHTML=`<span class=\"foco-chip-handle\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan><span class=\"foco-chip-text\">${escapeHtml(it.text)}<\u002Fspan>`;\n  c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/id',it.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});\n  c.addEventListener('dragend',()=>c.classList.remove('dragging'));\n  return c;\n}\nfunction buildWeekTask(it){\n  const c=document.createElement('div');c.className='week-task';c.draggable=true;c.dataset.id=it.id;\n  c.style.borderLeftColor=Q_META[it.q].color;\n  c.innerHTML=`<span style=\"flex:1;min-width:0\">${escapeHtml(it.text)}<\u002Fspan><button class=\"task-rm\" title=\"Quitar del día\">×<\u002Fbutton>`;\n  c.querySelector('.task-rm').addEventListener('click',e=>{e.stopPropagation();it.day=undefined;save();renderFoco();});\n  c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/id',it.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});\n  c.addEventListener('dragend',()=>c.classList.remove('dragging'));\n  return c;\n}\nfunction showWarn(d){\n  const w=document.getElementById('focoWarn');\n  w.innerHTML=`<div class=\"week-warn-msg\">⚠️ <span><strong>Ojo, ${DAYS[d]} ya tiene 3 tareas.<\u002Fstrong> Sobrecargar un día genera frustración. ¿Seguro que podés con todo? Si sí, adelante — pero dejá margen.<\u002Fspan><\u002Fdiv>`;\n  w.style.display='';\n  clearTimeout(window._wt);window._wt=setTimeout(()=>{w.style.display='none';},5000);\n}\n\n// ═══════════════ FINAL ════════════════════════════════\nfunction goFinal(){\n  goPage('pgFinal');\n  renderFinal();\n}\nfunction renderFinal(){\n  document.getElementById('finalName').textContent=state.name?(state.name.split(' ')[0]+'.'):'tu mapa.';\n  document.getElementById('finalH3').textContent=`¡Bien hecho${state.name?', '+state.name.split(' ')[0]:''}!`;\n  // Summary\n  const counts={hacer:0,planif:0,liberar:0,descartar:0};\n  state.items.forEach(i=>{if(counts[i.q]!==undefined)counts[i.q]++;});\n  const grid=document.getElementById('summaryGrid');grid.innerHTML='';\n  Object.entries(Q_META).forEach(([k,m])=>{\n    const c=document.createElement('div');c.className='summary-card';\n    c.style.borderTopColor=m.color;\n    c.innerHTML=`<div class=\"summary-num\" style=\"color:${m.color}\">${counts[k]}<\u002Fdiv><div class=\"summary-lbl\">${m.name}<\u002Fdiv>`;\n    grid.appendChild(c);\n  });\n  // Snapshot — re-render the matrix into final\n  const snap=document.getElementById('finalMatrixSnapshot');\n  snap.innerHTML=`\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:24px 0 12px\">Tu matriz<\u002Fdiv>\n    <div class=\"matrix-layout\">\n      <div class=\"matrix-y\">\n        <div class=\"matrix-y-lbl\">MUY IMPORTANTE ↑<\u002Fdiv>\n        <div class=\"matrix-y-lbl\">↓ POCO IMPORTANTE<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"matrix-grid\" id=\"finalMatrixGrid\"><\u002Fdiv>\n    <\u002Fdiv>`;\n  const fg=document.getElementById('finalMatrixGrid');\n  ['hacer','planif','liberar','descartar'].forEach(q=>{\n    const m=Q_META[q];\n    const items=state.items.filter(i=>i.q===q);\n    const div=document.createElement('div');div.className='matrix-q q-'+q;\n    div.innerHTML=`\n      <div class=\"matrix-q-hd\">\n        <div class=\"matrix-q-icon\">${q==='hacer'?'!':q==='planif'?'★':q==='liberar'?'↗':'✕'}<\u002Fdiv>\n        <div class=\"matrix-q-info\"><div class=\"matrix-q-name\">${m.name}<\u002Fdiv><div class=\"matrix-q-desc\">${m.desc}<\u002Fdiv><\u002Fdiv>\n        <span class=\"matrix-q-count\">${items.length}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"matrix-tasks\">${items.map(it=>`<div class=\"task-card\" style=\"border-left-color:${m.color};cursor:default\"><div class=\"task-cb${it.done?' done':''}\"><\u002Fdiv><div class=\"task-title${it.done?' done-txt':''}\">${escapeHtml(it.text)}<\u002Fdiv><\u002Fdiv>`).join('')||'<div class=\"matrix-empty\">—<\u002Fdiv>'}<\u002Fdiv>`;\n    fg.appendChild(div);\n  });\n}\n\n// ═══════════════ RESTART ════════════════════════════════\nfunction restartFlow(){\n  if(!confirm('¿Empezar de nuevo? Vas a perder lo que cargaste.'))return;\n  state={name:'',items:[],filterMode:'separate',density:'cozy',palette:'rosa',showDims:false};\n  tinder={pass:1,idx:0,history:[]};\n  save();applyTweaks();\n  document.getElementById('nameInput').value='';\n  goPage('pgIntro');\n}\n\n// ═══════════════ TWEAKS ════════════════════════════════\nfunction toggleTweaks(){document.getElementById('tweaksPanel').classList.toggle('on');}\nfunction setTweak(k,v){\n  state[k]=v;save();applyTweaks();\n}\nfunction applyTweaks(){\n  // density\n  const cozy=state.density!=='compact';\n  document.documentElement.style.setProperty('--den',cozy?'1':'.85');\n  // segments visual\n  document.querySelectorAll('.tweak-seg').forEach(s=>{\n    s.classList.toggle('on',s.dataset.val===state[s.dataset.tw]);\n  });\n  // palette\n  if(state.palette==='cool'){\n    document.documentElement.style.setProperty('--rose','#1a9fa8');\n    document.documentElement.style.setProperty('--q-hacer','#1e3fa8');\n    document.documentElement.style.setProperty('--q-hacer-l','#edf2fd');\n  } else {\n    document.documentElement.style.setProperty('--rose','#c2415a');\n    document.documentElement.style.setProperty('--q-hacer','#c2415a');\n    document.documentElement.style.setProperty('--q-hacer-l','#fdf0f2');\n  }\n}\n\n// Close tweaks panel on outside click\ndocument.addEventListener('click',e=>{\n  const p=document.getElementById('tweaksPanel');\n  if(!p.classList.contains('on'))return;\n  if(p.contains(e.target)||document.getElementById('tweaksFab').contains(e.target))return;\n  p.classList.remove('on');\n});\n\n// ═══════════════ INIT ════════════════════════════════\nload();\napplyTweaks();\nif(state.name && state.items.length){\n  document.getElementById('nameInput').value=state.name;\n}\nupdateProg('pgIntro');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
